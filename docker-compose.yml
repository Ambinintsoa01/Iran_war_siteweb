version: '3.8'

services:
  web:
    build: .
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
      - ./upload:/var/www/html/upload
    depends_on:
      - db
    networks:
      - iranwar-net
    restart: unless-stopped

  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: iranwar
      MYSQL_DATABASE: Iran_War
      # Pas de MYSQL_USER=root : on utilise seulement le root par défaut
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql-init.sql:/docker-entrypoint-initdb.d/1-init.sql
    ports:
      - "3306:3306"
    networks:
      - iranwar-net
    restart: unless-stopped

volumes:
  db_data:

networks:
  iranwar-net:
    driver: bridge

