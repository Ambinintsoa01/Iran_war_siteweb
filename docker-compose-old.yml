version: '3.8'

services:
  web:
    build: .
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
      - ./upload:/var/www/html/upload  # For image uploads if needed
    depends_on:
      - db
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html
    networks:
      - iranwar-net
    restart: unless-stopped

  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:\n      MYSQL_ROOT_PASSWORD: ''\n      MYSQL_DATABASE: Iran_War\n      MYSQL_USER: root\n      MYSQL_PASSWORD: ''
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql-init.sql:/docker-entrypoint-initdb.d/1-init.sql
    ports:
      - "3306:3306"
    networks:
      - iranwar-net
    restart: unless-stopped

volumes:
  db_data:

networks:
  iranwar-net:
    driver: bridge

